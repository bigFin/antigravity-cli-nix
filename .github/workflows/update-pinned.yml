name: Update pinned Antigravity CLI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1,3,5"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Update pinned package
        run: ./scripts/update-pinned.sh

      - name: Build packages
        run: |
          nix flake check --all-systems
          nix build .#agy-bin
          nix build .#agy-fhs-live
          nix build .#agy-sandboxed

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/antigravity-cli
          title: Update pinned Antigravity CLI
          commit-message: Update pinned Antigravity CLI
          body: |
            Automated update from Google's Antigravity CLI manifest.

            This updates only `packages/pin.json` for the pinned `agy-bin` package.
            The live FHS wrapper
            remains a runtime bootstrapper.
