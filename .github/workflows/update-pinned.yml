name: Update pinned Antigravity CLI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1,3,5"

permissions:
  contents: read

concurrency:
  group: update-antigravity-cli
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Update pinned package
        run: ./scripts/update-pinned.sh

      - name: Build packages
        run: |
          nix flake check --all-systems
          nix build --no-link .#agy-bin
          nix build --no-link .#agy-fhs-live
          nix build --no-link .#agy-sandboxed

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN }}
          branch: update/antigravity-cli
          add-paths: packages/pin.json
          title: Update pinned Antigravity CLI
          commit-message: Update pinned Antigravity CLI
          body: |
            Automated update from Google's Antigravity CLI manifest.

            This updates only `packages/pin.json` for the pinned `agy-bin` package.
            The live FHS wrapper
            remains a runtime bootstrapper.

      - name: Approve pull request
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.AUTO_APPROVE_TOKEN }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number('${{ steps.cpr.outputs.pull-request-number }}'),
              event: 'APPROVE',
              body: 'Auto-approved trusted scheduled update PR.'
            });

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.UPDATE_PR_TOKEN }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash --delete-branch
