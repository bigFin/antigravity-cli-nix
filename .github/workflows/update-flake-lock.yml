name: Update flake lock

on:
  workflow_dispatch:
  schedule:
    - cron: "43 10 * * 1"

permissions:
  contents: read

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Update flake inputs
        run: nix flake update

      - name: Check flake
        run: nix flake check --all-systems

      - name: Build packages
        run: |
          nix build --no-link .#agy-bin
          nix build --no-link .#agy-fhs-live
          nix build --no-link .#agy-sandboxed

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN }}
          branch: update/flake-lock
          add-paths: flake.lock
          title: Update flake lock
          commit-message: Update flake lock
          body: |
            Automated update of `flake.lock`.

      - name: Approve pull request
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.AUTO_APPROVE_TOKEN }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number('${{ steps.cpr.outputs.pull-request-number }}'),
              event: 'APPROVE',
              body: 'Auto-approved trusted scheduled update PR.'
            });

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.UPDATE_PR_TOKEN }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash --delete-branch
